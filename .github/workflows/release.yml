name: Release

# Publishes the .NET tool to nuget.org when a version tag is pushed.
#
# How to cut a release, and the one-time nuget.org setup this needs:
# docs/development.md, "Releasing SignalMe".
#
# Authentication uses nuget.org trusted publishing (OIDC): the job exchanges a GitHub OIDC token for a
# short-lived key at push time, so no long-lived API key is stored in this repository.

on:
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write   # needed to request the GitHub OIDC token exchanged for a nuget.org key
  contents: write   # needed to create the GitHub release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    runs-on: windows-latest
    # Publishing is bound to an environment: a required reviewer can be added on it
    # (Settings > Environments > nuget) to make every release manually approved.
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Source Link embeds the commit, it needs the full history

      # Reads global.json, so the agent installs exactly the SDK the repository pins. With a
      # zero-warning policy the SDK is part of the build definition: its analyzers and its compiler
      # decide what is a warning, and a floating version means green here and red there.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check the nuget.org account is configured
        shell: pwsh
        env:
          # Accepted as a secret or as a repository variable: it is an account name, not a credential.
          NUGET_USER: ${{ secrets.NUGET_USER || vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "NUGET_USER is not configured: add it in Settings > Secrets and variables > Actions, holding the nuget.org account -- user or organization -- that owns the trusted publishing policy."
          }
          Write-Host "Publishing as the nuget.org account $env:NUGET_USER."

      - name: Check the tag matches the version of the project
        shell: pwsh
        run: |
          $version = (dotnet msbuild SignalMe/SignalMe.csproj -getProperty:Version).Trim()
          $expectedTag = "v$version"
          $tag = '${{ github.ref_name }}'
          if ($tag -ne $expectedTag) {
            throw "Tag '$tag' does not match the version of the project ('$version', e.g. tag '$expectedTag'). Fix <Version> or the tag, then tag again."
          }
          Write-Host "Publishing version $version from tag $tag."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack SignalMe/SignalMe.csproj -c Release --no-build -o artifacts

      - name: Validate package content
        shell: pwsh
        run: ./build/Validate-Package.ps1 -ArtifactsDirectory artifacts

      # The package is published only if it really installs as a tool and runs.
      - name: Install and run the tool
        shell: pwsh
        run: ./build/Test-ToolInstall.ps1 -ArtifactsDirectory artifacts

      # Kept right before the push: the key returned by the token service is short-lived.
      - name: Log in to nuget.org (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # The matching .snupkg sitting next to the .nupkg is pushed along automatically.
          $package = (Get-ChildItem artifacts -Filter *.nupkg | Select-Object -First 1).FullName
          Write-Host "Pushing $package"
          dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag    = '${{ github.ref_name }}'
          $assets = (Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, uploading the packages to it."
            gh release upload $tag $assets --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $assets --title $tag --generate-notes
          }
